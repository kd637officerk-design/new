name: Build Windows 11 app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run dist:win
      - name: SHA-256 checksums
        shell: pwsh
        run: Get-FileHash dist\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Skeletor-Video-Windows-11
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
